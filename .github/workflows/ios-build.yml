name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release build'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli

      - name: Setup Python for backend info
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy environment config
        working-directory: ./frontend
        run: |
          # Create a production config
          echo "VITE_APP_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build Quasar app
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync ios

      - name: Check for CocoaPods
        working-directory: ./frontend/ios/App
        run: |
          if [ -f "Podfile" ]; then
            echo "has_podfile=true" >> $GITHUB_ENV
            echo "Podfile found, installing pods..."
            pod install --repo-update
          else
            echo "has_podfile=false" >> $GITHUB_ENV
            echo "No Podfile found, skipping pod install"
          fi

      - name: Create export options plist
        working-directory: ./frontend/ios/App
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Build iOS app (archive)
        working-directory: ./frontend/ios/App
        run: |
          # Use workspace if it exists, otherwise use project
          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using workspace..."
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath ${{ runner.temp }}/App.xcarchive \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
              archive || echo "Build may have failed due to signing, continuing..."
          else
            echo "Using project..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath ${{ runner.temp }}/App.xcarchive \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
              archive || echo "Build may have failed due to signing, continuing..."
          fi

      - name: Export IPA
        working-directory: ./frontend/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/App.xcarchive \
            -exportPath ${{ runner.temp }}/export \
            -exportOptionsPlist exportOptions.plist \
            ALLOW_MISSING_PROVISIONING=1 || echo "Export failed, this is expected without proper signing"

      - name: Find and upload IPA (if exists)
        run: |
          find ${{ runner.temp }}/export -name "*.ipa" -type f || echo "No IPA found"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-iOS-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Xcode archive (for manual signing)
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-iOS-Archive
          path: ${{ runner.temp }}/App.xcarchive
          retention-days: 7
          if-no-files-found: warn

      - name: Release (if triggered manually)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ runner.temp }}/export/*.ipa
          tag_name: v${{ github.run_number }}
          name: NexControl v${{ github.run_number }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
