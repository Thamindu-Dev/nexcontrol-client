name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release build'
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install -g @capacitor/cli@latest

      - name: Create production environment file
        working-directory: ./frontend
        run: |
          cat > .env.production << EOF
          VITE_APP_VERSION=${{ github.run_number }}
          VITE_BUILD_DATE=$(date +%Y-%m-%d)
          VITE_BUILD_TYPE=production
          VITE_GIT_SHA=${{ github.sha }}
          EOF

          cat .env.production

      - name: Build Quasar app
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync ios

      - name: Update iOS version and build
        working-directory: ./frontend/ios/App
        run: |
          # Update CFBundleShortVersionString and CFBundleVersion
          plutil -replace CFBundleShortVersionString -string "${{ github.run_number }}" App/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" App/Info.plist

      - name: Clean Pods and derived data
        working-directory: ./frontend/ios/App
        run: |
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "Cleaned Pods and derived data"

      - name: Install CocoaPods dependencies
        working-directory: ./frontend/ios/App
        run: |
          if [ -f "Podfile" ]; then
            echo "Installing CocoaPods..."
            pod install --repo-update
          else
            echo "No Podfile found, skipping pod install"
          fi

      - name: Build iOS app (archive without code signing)
        working-directory: ./frontend/ios/App
        run: |
          # Use NexControl scheme (from capacitor.config.json)
          if [ -f "NexControl.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using workspace with NexControl scheme..."
            xcodebuild -workspace NexControl.xcworkspace \
              -scheme NexControl \
              -configuration Release \
              -archivePath ${{ runner.temp }}/NexControl.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive
          elif [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using workspace with App scheme..."
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath ${{ runner.temp }}/NexControl.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive
          else
            echo "Using project with App scheme..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath ${{ runner.temp }}/NexControl.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive
          fi

      - name: Export .app bundle for sideloading
        run: |
          # Copy the .app bundle from the archive
          cp -R ${{ runner.temp }}/NexControl.xcarchive/Products/Applications/*.app ${{ runner.temp }}/NexControl.app

      - name: Create IPA for sideloading (optional)
        working-directory: ./frontend/ios/App
        run: |
          # Try to create unsigned IPA for sideloading tools
          if [ -d "${{ runner.temp }}/NexControl.xcarchive" ]; then
            mkdir -p ${{ runner.temp }}/ipa/Payload
            cp -R ${{ runner.temp }}/NexControl.xcarchive/Products/Applications/*.app ${{ runner.temp }}/ipa/Payload/
            cd ${{ runner.temp }}/ipa
            zip -r ../NexControl-unsigned.ipa .
          fi

      - name: Upload .app bundle (for Sideloadly/AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-iOS-App-Bundle
          path: ${{ runner.temp }}/NexControl.app
          retention-days: 90

      - name: Upload unsigned IPA (for sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-iOS-Unsigned-IPA
          path: ${{ runner.temp }}/NexControl-unsigned.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Xcode archive (for manual signing)
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-iOS-Archive
          path: ${{ runner.temp }}/NexControl.xcarchive
          retention-days: 90

      - name: Release (if triggered manually)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ runner.temp }}/NexControl-unsigned.ipa
          tag_name: v${{ github.run_number }}
          name: NexControl v${{ github.run_number }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
