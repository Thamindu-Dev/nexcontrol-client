name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release build'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli

      - name: Set version info
        working-directory: ./frontend
        run: |
          echo "VITE_APP_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Build Quasar app
        working-directory: ./frontend
        run: npm run build

      - name: Add Android platform
        working-directory: ./frontend
        run: |
          npx cap add android || echo "Android platform may already exist"
        continue-on-error: true

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./frontend/App/android
        run: |
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-Android
          path: frontend/App/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release (if triggered manually)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/App/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
